<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>离线 - AI-PM</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #FF6B35 0%, #FF3D00 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    .container {
      text-align: center;
      max-width: 400px;
      padding: 40px 20px;
    }
    .icon {
      font-size: 80px;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 24px;
      font-weight: 600;
    }
    p {
      margin: 0 0 24px;
      opacity: 0.9;
      font-size: 14px;
      line-height: 1.6;
    }
    button {
      background: white;
      color: #FF3D00;
      border: none;
      padding: 12px 32px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:active { transform: scale(0.95); }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>当前处于离线状态</h1>
    <p>您当前网络不可用，已切换到离线模式。<br/>恢复网络后即可继续使用全部功能。</p>
    <button onclick="location.reload()">重试连接</button>
  </div>
  <script>
    // 网络恢复后自动重载
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
