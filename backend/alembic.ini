# Alembic configuration
# TongWei AI PM - database migrations

[alembic]
# script directory
script_location = alembic

# template file
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# timestamp prefix
prepend_sys_path = .

# version path
version_path_separator = os

# database URL (overridden at runtime by app settings; must be a sync driver)
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/tw_ai_pms

# logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
